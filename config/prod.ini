[queue]
; 单 Bot 全局速率上限（条/秒），设为 0 将导致不发送
global_rate_per_sec = 25
; 单群最小发送间隔（毫秒），0 表示不限制
per_chat_min_gap_ms = 1000
; 每次从延迟队列搬运到就绪队列的最大条数
mover_batch = 200
; 搬运器轮询间隔（毫秒），必须 > 0
mover_interval_ms = 100
; 背压窗口（秒），用于估算入队阈值
horizon_sec = 120
; Stream 最大长度，0 表示不限制
stream_max_len = 0
; 允许同时活跃的 chat runner 上限，0 表示不限制
max_chat_runners = 0
; chat runner 空闲回收时间（毫秒），<=0 表示不回收
idle_runner_ttl_ms = 600000
; 候选 bot 缓存时间（毫秒）
candidate_cache_ttl_ms = 3600000
; bot 失败退避阶梯（毫秒，逗号分隔）
failure_backoff_ms = 60000,300000,900000,3600000,10800000,21600000,43200000,86400000
; 单 bot 连续失败最大持续时间（毫秒）
failure_max_duration_ms = 86400000
