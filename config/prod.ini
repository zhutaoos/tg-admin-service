[queue]
; 分片数量（按 chatID 一致性映射；结合并发与群分布评估）
shard_count = 16
; 单 Bot 全局速率上限（条/秒），设为 0 将导致不发送
global_rate_per_sec = 25
; 单群最小发送间隔（毫秒），0 表示不限制
per_chat_min_gap_ms = 1000
; 每次从延迟队列搬运到就绪队列的最大条数
mover_batch = 200
; 搬运器轮询间隔（毫秒），必须 > 0
mover_interval_ms = 100
; 背压窗口（秒），用于估算入队阈值
horizon_sec = 120
; Stream 最大长度，0 表示不限制
stream_max_len = 0
